version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: meeting_intelligence_postgres_prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-asavaliya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Ambition@3941}
      POSTGRES_DB: ${POSTGRES_DB:-meetings_db}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-asavaliya}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - meeting_intelligence_prod
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: meeting_intelligence_redis_prod
    command: redis-server --requirepass ${REDIS_PASSWORD:-your_redis_password}
    volumes:
      - redis_data_prod:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - meeting_intelligence_prod
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meeting_intelligence_backend_prod
    environment:
      PROJECT_NAME: Meeting Intelligence
      ENV: production
      SQLALCHEMY_DATABASE_URI: postgresql://${POSTGRES_USER:-asavaliya}:${POSTGRES_PASSWORD:-Ambition@3941}@postgres:5432/${POSTGRES_DB:-meetings_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-your_redis_password}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-hafois58ys5sfpipqnzxh}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
      STORAGE_PATH: /app/data/uploads
    volumes:
      - ./backend/data:/app/data
    expose:
      - "8000"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    networks:
      - meeting_intelligence_prod
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Celery Worker
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meeting_intelligence_celery_prod
    environment:
      PROJECT_NAME: Meeting Intelligence
      ENV: production
      SQLALCHEMY_DATABASE_URI: postgresql://${POSTGRES_USER:-asavaliya}:${POSTGRES_PASSWORD:-Ambition@3941}@postgres:5432/${POSTGRES_DB:-meetings_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-your_redis_password}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-hafois58ys5sfpipqnzxh}
      STORAGE_PATH: /app/data/uploads
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped
    depends_on:
      - redis
      - postgres
      - backend
    command: celery -A app.tasks.ingest.celery worker --loglevel=info --pool=prefork --concurrency=4
    networks:
      - meeting_intelligence_prod
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: meeting_intelligence_frontend_prod
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      VITE_API_URL: ${API_URL:-http://localhost:8000/api/v1}
    networks:
      - meeting_intelligence_prod
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: meeting_intelligence_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - meeting_intelligence_prod
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data_prod:
  redis_data_prod:

networks:
  meeting_intelligence_prod:
    driver: bridge
