version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: meeting_intelligence_postgres_local
    environment:
      POSTGRES_USER: asavaliya
      POSTGRES_PASSWORD: Ambition@3941
      POSTGRES_DB: meetings_db
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asavaliya"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - meeting_intelligence

  # Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: meeting_intelligence_redis_local
    ports:
      - "6379:6379"
    volumes:
      - redis_data_local:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - meeting_intelligence

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meeting_intelligence_backend_local
    environment:
      PROJECT_NAME: Meeting Intelligence
      ENV: development
      SQLALCHEMY_DATABASE_URI: postgresql://asavaliya:Ambition@3941@postgres:5432/meetings_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: hafois58ys5sfpipqnzxh
      CORS_ORIGINS: '["http://localhost:3000", "http://localhost:5173", "http://frontend:3000"]'
      STORAGE_PATH: /app/data/uploads
    volumes:
      - ./backend:/app
      - ./backend/data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - meeting_intelligence

  # Celery Worker
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meeting_intelligence_celery_local
    environment:
      PROJECT_NAME: Meeting Intelligence
      ENV: development
      SQLALCHEMY_DATABASE_URI: postgresql://asavaliya:Ambition@3941@postgres:5432/meetings_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: hafois58ys5sfpipqnzxh
      STORAGE_PATH: /app/data/uploads
    volumes:
      - ./backend:/app
      - ./backend/data:/app/data
    depends_on:
      - redis
      - postgres
      - backend
    command: celery -A app.tasks.ingest.celery worker --loglevel=info --pool=solo
    networks:
      - meeting_intelligence

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: meeting_intelligence_frontend_local
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    networks:
      - meeting_intelligence

volumes:
  postgres_data_local:
  redis_data_local:

networks:
  meeting_intelligence:
    driver: bridge
